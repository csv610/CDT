name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [gcc, clang]
        exclude:
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(nproc)

    - name: Test
      working-directory: build
      run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

  build-msvc:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Test
      working-directory: build
      run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

  clang-format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run clang-format
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y clang-format
        find . -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run -Werror | grep -q . && { echo "Code formatting issues found"; exit 1; } || echo "Code formatting OK"

  static-analysis:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-tidy
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y clang-tidy

    - name: Run clang-tidy
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug
        cmake --build build --target all -- -j $(nproc) 2>&1 | head -50 || true